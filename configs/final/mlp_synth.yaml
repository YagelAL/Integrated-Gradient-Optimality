# @package _global_
# Final-run config of the shipped checkpoint checkpoints/synthetic/mlp/final_mlp.pt.
# Use with: scripts/train.py +final=mlp_synth  or  scripts/run_explainer_eval.py +final=mlp_synth
defaults:
  - override /dataset: synth
  - override /recommender: mlp

recommender:
  hidden_dim: 512
  dropout: 0.5
  beta: 0.5

trainer:
  batch_size: 512
  num_epochs: 8
  optimizer:
    lr: 0.003
    weight_decay: 1.0e-05

recommender_artifact:
  local_path: checkpoints/synthetic/mlp/final_mlp.pt

final_run: true
wandb: null
