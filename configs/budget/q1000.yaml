# @package _global_
#
# Iso-budget operating point Q = 1000: recommender forward passes per
# explanation, K = 5 (ke grid).
#   ig     2(P+1)   -> P = 499 integration steps
#   pls    K*EB     -> EB = 200 objective evaluations per ke
#   spinrec_del_ke (Nb+1)*2(P+1) + K*(Nb+2) <= Q -> Nb = 89 sampled baselines, P = 2 steps

budget_q: 1000

all_explainers:
  ig:
    name: ig
    params:
      num_steps: 499

  pls:
    name: pls
    params:
      selection_objective: del
      eval_budget: 200
      num_restarts: 40            # = max(2, EB//5)
      temp_decay: 0.95
      temp_init: 0.05             # SA start temperature, in objective units
      max_forward_batch: ${max_forward_batch}
      seed: 42

  spinrec_del_ke:
    name: spinrec
    alias: spinrec_del_ke
    params:
      method: sample_random_user
      seed: 42
      num_baseline_samples: 89
      num_steps: 2
      baseline_pool_size: 96      # whole batches are drawn: pool >= num_baseline_samples
      selection_objective: del_ke

explainers:
  - ${all_explainers.ig}
  - ${all_explainers.pls}
